x-sk-base: &sk_base
  restart: unless-stopped
  labels:
    com.skale.prefix: "node"
  cpu_shares: 128
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "10m"

services:
  admin:
    <<: *sk_base
    container_name: sk_admin
    image: skalenetwork/admin:3.2.0-fair.7
    network_mode: host
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      ENDPOINT: ${ENDPOINT}
      SKALE_DIR_HOST: ${SKALE_DIR}
      ENV_TYPE: ${ENV_TYPE}
      SCHAIN_NAME: ${SCHAIN_NAME}
      TELEGRAF: ${TELEGRAF}
      INFLUX_URL: ${INFLUX_URL}
      PASSIVE_NODE: "True"
      MAX_SCHAIN_FAILED_RPC_COUNT: 60
      MANAGER_CONTRACTS: ${MANAGER_CONTRACTS}
      IMA_CONTRACTS: ${IMA_CONTRACTS}
      DISABLE_COLORS: "True"
    command: "python3 skale_passive.py"
    volumes:
      - /var/run/skale:/var/run/skale
      - ${SKALE_DIR}:/skale_vol
      - ${SKALE_DIR}/node_data:/skale_node_data
      - ${SKALE_LIB_PATH}:${SKALE_LIB_PATH}
      - /etc/nft.conf.d/skale/chains:/etc/nft.conf.d/skale/chains
    healthcheck:
      test: ["CMD", "python3", "healthchecks/admin.py"]
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 30s

  nginx:
    <<: *sk_base
    image: nginx:1.29.1
    container_name: sk_nginx
    network_mode: host
    volumes:
      - ${SKALE_DIR}/node_data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SKALE_DIR}/node_data/ssl:/ssl:ro
      - ${FILESTORAGE_MAPPING}:/filestorage:ro
      - type: bind
        bind:
          propagation: slave
        source: ${SCHAINS_MNT_DIR}
        target: ${SCHAINS_MNT_DIR}
        read_only: true
