x-sk-base: &sk_base
  restart: unless-stopped
  labels:
    com.skale.prefix: "node"
  cpu_shares: 128
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "10m"

services:
  transaction-manager:
    <<: *sk_base
    container_name: sk_tm
    image: skalenetwork/transaction-manager:3.2.0-beta.0
    network_mode: host
    tty: true
    volumes:
      - ${SKALE_DIR}:/skale_vol
      - ${SKALE_DIR}/node_data:/skale_node_data

  admin:
    <<: *sk_base
    container_name: sk_admin
    image: skalenetwork/admin:3.3.0-beta.3 
    cpu_shares: 192
    network_mode: host
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: "python3 skale_admin.py"
    volumes:
      - /var/run/skale:/var/run/skale
      - ${SKALE_DIR}:/skale_vol
      - ${SKALE_LIB_PATH}:${SKALE_LIB_PATH}
      - /etc/nft.conf.d/skale/chains:/etc/nft.conf.d/skale/chains
    healthcheck:
      test: ["CMD", "python3", "healthchecks/admin.py"]
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 30s

  api:
    <<: *sk_base
    container_name: sk_api
    image: skalenetwork/admin:3.3.0-beta.3 
    network_mode: host
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: "gunicorn skale_api:app -c gunicorn.conf.py"
    volumes:
      - /var/run/skale:/var/run/skale
      - ${SKALE_DIR}:/skale_vol
      - ${SKALE_LIB_PATH}:${SKALE_LIB_PATH}
      - /etc/nft.conf.d/skale/chains:/etc/nft.conf.d/skale/chains

  celery:
    <<: *sk_base
    container_name: celery
    image: skalenetwork/admin:3.3.0-beta.3 
    network_mode: host
    tty: true
    command: "celery -A tools.notifications.tasks worker --loglevel=info"

    volumes:
      - /var/run/skale:/var/run/skale

  redis:
    <<: *sk_base
    container_name: sk_redis
    image: "redis:8.6.0-alpine"
    network_mode: host
    tty: true
    environment:
      - REDIS_REPLICATION_MODE=master
    command: "redis-server /data/redis.conf"
    volumes:
      - ${SKALE_DIR}/node_data/redis-data:/data/db:rw
      - ${SKALE_DIR}/config/redis.conf:/data/redis.conf

  bounty:
    <<: *sk_base
    container_name: sk_bounty
    image: skalenetwork/bounty-agent:3.1.0-beta.0
    network_mode: host
    volumes:
      - ${SKALE_DIR}:/skale_vol

  watchdog:
    <<: *sk_base
    container_name: sk_watchdog
    image: skalenetwork/watchdog:3.2.0-beta.1
    network_mode: host
    volumes:
      - ${SKALE_DIR}/node_data/settings:/settings:ro
    environment:
      ALLOWED_TS_DIFF: 300
      FLASK_APP_PORT: 3010
      FLASK_APP_HOST: "127.0.0.1"
      FLASK_DEBUG_MODE: "False"
      SKALE_NETWORK_TYPE: "skale"
      PASSIVE_NODE: ${PASSIVE_NODE}

  nginx:
    <<: *sk_base
    image: nginx:1.29.5
    container_name: sk_nginx
    network_mode: host
    depends_on:
      - watchdog
    volumes:
      - ${SKALE_DIR}/node_data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SKALE_DIR}/node_data/ssl:/ssl:ro
      - ${FILESTORAGE_MAPPING}:/filestorage:ro
      - type: bind
        bind:
          propagation: slave
        source: ${SCHAINS_MNT_DIR}
        target: ${SCHAINS_MNT_DIR}
        read_only: true

  advisor:
    <<: *sk_base
    image: gcr.io/cadvisor/cadvisor-amd64:v0.50.0
    container_name: monitor_cadvisor
    cpu_shares: 128
    network_mode: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  node-exporter:
    <<: *sk_base
    container_name: monitor_node_exporter
    image: quay.io/prometheus/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(mnt|dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)"
    network_mode: host

  filebeat:
    <<: *sk_base
    container_name: sk_filebeat
    user: root
    image: elastic/filebeat:9.2.5
    network_mode: host
    environment:
      FILEBEAT_HOST: ${FILEBEAT_HOST}
    volumes:
      - ${SKALE_DIR}/node_data/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log/docker-lvmpy:/var/log/docker-lvmpy:ro
      - /var/run/skale:/var/run/skale
