services:
  base: &skale_base
    image: rancher/pause:3.6
    restart: unless-stopped
    labels:
      com.skale.prefix: "node"
    cpu_shares: 128
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

  fair-admin-passive:
    <<: *skale_base
    container_name: fair_admin
    image: skalenetwork/admin:3.1.0-fair-beta.2
    cpu_shares: 192
    network_mode: host
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BOOT_ENDPOINT: ${BOOT_ENDPOINT}
      SKALE_DIR_HOST: ${SKALE_DIR}
      MAX_ALLOWED_LOG_TIME_DIFF: 600
      ENV_TYPE: ${ENV_TYPE}
      ALLOWED_TS_DIFF: 300
      TELEGRAF: ${TELEGRAF}
      INFLUX_URL: ${INFLUX_URL}
      FAIR_CONTRACTS: ${FAIR_CONTRACTS}
      SKALE_NETWORK_TYPE: "fair"
      PASSIVE_NODE: "True"

    command: "python3 fair_passive.py"
    volumes:
      - /var/run/skale:/var/run/skale
      - ${SKALE_DIR}:/skale_vol
      - ${SKALE_DIR}/node_data:/skale_node_data
      - ${SKALE_LIB_PATH}:${SKALE_LIB_PATH}
      - /etc/nft.conf.d/skale/chains:/etc/nft.conf.d/skale/chains
    healthcheck:
      test: ["CMD", "python3", "healthchecks/admin.py"]
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 30s

  fair-api:
    <<: *skale_base
    container_name: fair_api
    image: skalenetwork/admin:3.1.0-fair-beta.2
    network_mode: host
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BOOT_ENDPOINT: ${BOOT_ENDPOINT}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_APP_PORT: 3007
      FLASK_APP_HOST: "127.0.0.1"
      FLASK_DEBUG_MODE: "False"
      SKALE_DIR_HOST: ${SKALE_DIR}
      MONITORING_CONTAINERS: ${MONITORING_CONTAINERS}
      BACKUP_RUN: ${BACKUP_RUN}
      ENV_TYPE: ${ENV_TYPE}
      ALLOWED_TS_DIFF: 300
      FAIR_CONTRACTS: ${FAIR_CONTRACTS}
      SKALE_NETWORK_TYPE: "fair"
      PASSIVE_NODE: "True"
    command: "gunicorn fair_api:app -c gunicorn.conf.py"
    volumes:
      - /var/run/skale:/var/run/skale
      - ${SKALE_DIR}:/skale_vol
      - ${SKALE_DIR}/node_data:/skale_node_data
      - ${SKALE_LIB_PATH}:${SKALE_LIB_PATH}
      - /etc/nft.conf.d/skale/chains:/etc/nft.conf.d/skale/chains

  redis:
    <<: *skale_base
    container_name: skale_redis
    image: "redis:8.0.1-alpine"
    network_mode: host
    tty: true
    environment:
      - REDIS_REPLICATION_MODE=master
    command: "redis-server /data/redis.conf"
    volumes:
      - ${SKALE_DIR}/node_data/redis-data:/data:rw
      - ${SKALE_DIR}/config/redis.conf:/data/redis.conf
    restart: unless-stopped

  nginx:
    <<: *skale_base
    image: nginx:1.20.2
    container_name: skale_nginx
    network_mode: host
    volumes:
      - ${SKALE_DIR}/node_data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SKALE_DIR}/node_data/ssl:/ssl:ro
      - type: bind
        bind:
          propagation: slave
        source: ${SCHAINS_MNT_DIR}
        target: ${SCHAINS_MNT_DIR}
        read_only: true
